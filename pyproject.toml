[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "commercelens"
version = "0.1.0"
description = "Evidence-grounded commerce analysis over Olist and tabular benchmarks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.0",
    "sqlglot==29.0.1",
    "langgraph==1.1.3",
    "httpx==0.28.1",
    "pydantic==2.12.3",
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
]

[project.optional-dependencies]
demo = ["streamlit==1.58.0"]
test = ["pytest==9.0.2"]
benchmark = ["databench-eval==4.0.1", "pyarrow==23.0.0"]

[project.scripts]
commercelens = "commercelens.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
